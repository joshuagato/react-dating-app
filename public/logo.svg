<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Heart Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)" />

  <!-- Central Crushr Heart Icon -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <path 
      d="M256 420s-130-80-175-165c-35-66-10-135 55-150 50-12 95 15 120 50 25-35 70-62 120-50 65 15 90 84 55 150-45 85-175 165-175 165z" 
      fill="#ffffff" 
      opacity="0.95" 
    />
    <!-- Accent Spark/Flame overlay -->
    <path 
      d="M256 180c15 35 45 55 45 85 0 25-20 45-45 45s-45-20-45-45c0-30 30-50 45-85z" 
      fill="url(#bgGradient)" 
      opacity="0.8" 
    />
  </g>
</svg>
